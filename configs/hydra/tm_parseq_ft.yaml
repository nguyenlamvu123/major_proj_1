# PARSEQ fine-tune từ trọng số pretrained (charset 94 ký tự) sang charset tiếng Việt.
# Giống tm_parseq, chỉ khác _target_ = factory trademark_ocr.pretrained.finetune: nạp mọi tensor
# cùng tên + cùng kích thước, bỏ head/text_embed (phụ thuộc charset). KHÔNG dùng `pretrained:`
# của parseq (strict -> lỗi size mismatch với charset VN). Xem DESIGN.md 16.6.
# Chạy train thật:  bash scripts/05_train.sh parseq_ft      (lần đầu tải ~95 MB qua torch.hub)
# Dry-run kiểm chứng: python3 -m trademark_ocr.train_utils --config tm_parseq_ft --dry-run -o model.init_from=null
defaults:
  - _self_
  - charset: charset_vi   # # @package _global_ -> nạp charset_train/charset_test (tiếng Việt NFC)

model:
  _convert_: all
  name: parseq_ft
  _target_: trademark_ocr.pretrained.finetune
  target: strhub.models.parseq.system.PARSeq
  init_from: parseq             # tên bản phát hành parseq hoặc đường dẫn .pt/.ckpt; null = từ đầu
  img_size: [32, 128]          # [H, W]
  max_label_length: 25
  batch_size: 64
  weight_decay: 0.0
  warmup_pct: 0.075
  # architecture (strhub.models.parseq) — perm_num phai chan khi perm_mirrored
  patch_size: [4, 8]
  embed_dim: 384
  enc_num_heads: 6
  enc_mlp_ratio: 4
  enc_depth: 12
  dec_num_heads: 12
  dec_mlp_ratio: 4
  dec_depth: 1
  perm_num: 6
  perm_forward: true
  perm_mirrored: true
  dropout: 0.1
  decode_ar: true
  refine_iters: 1
  lr: 7e-4

data:
  _target_: strhub.data.module.SceneTextDataModule
  root_dir: ${oc.env:DATA_ROOT,/media/zaibachkhoa/AC84-F995/trademark_data}/lmdb
  train_dir: trademark           # == lmdb/train/trademark (nhánh 05)
  batch_size: ${model.batch_size}
  img_size: ${model.img_size}
  charset_train: ${model.charset_train}
  charset_test: ${model.charset_test}
  max_label_length: ${model.max_label_length}
  remove_whitespace: false       # charset có space
  normalize_unicode: false       # BẮT BUỘC: nếu true sẽ NFKD->ASCII mất dấu tiếng Việt
  min_image_dim: 0
  augment: true
  num_workers: 4

trainer:
  _target_: pytorch_lightning.Trainer
  _convert_: all
  max_epochs: 20
  val_check_interval: 1.0   # dữ liệu nhỏ: validate mỗi epoch (~68 step/epoch @bs=64)
  gradient_clip_val: 20
  limit_train_batches: 1.0    # ghi đè: --limit-train-batches 2  (khi smoke test)
  limit_val_batches: 1.0
  max_steps: -1
  log_every_n_steps: 1    # in loss mỗi step (smoke test 2 batch vẫn thấy loss)
  accelerator: gpu
  devices: 1

ckpt_path: null
pretrained: null

hydra:
  output_subdir: config
  run:
    dir: ${oc.env:DATA_ROOT,/media/zaibachkhoa/AC84-F995/trademark_data}/runs/${model.name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${oc.env:DATA_ROOT,/media/zaibachkhoa/AC84-F995/trademark_data}/runs/${model.name}/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
